name: CD gitops

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build & Deploy GitOps Pipeline
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. Checkout repository code
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.TOKEN_GITHUB || secrets.GITHUB_TOKEN }}

      - name: 2. Setup Docker Buildx environment
        uses: docker/setup-buildx-action@v3.10.0

      - name: 3. Authenticate with Docker Hub
        uses: docker/login-action@v3.3.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 4. Build Docker image and push to registry
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/gitopsfranciscomiguel:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/gitopsfranciscomiguel:latest

      - name: 5. Install Kustomize binary
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash -s 5.4.1
          sudo mv kustomize /usr/local/bin/

      - name: 6. Update Kustomize image tag in k8s manifests
        run: |
          cd k8s
          kustomize edit set image goserver=${{ secrets.DOCKER_USERNAME }}/gitopsfranciscomiguel:${{ github.sha }}

      - name: 7. Commit and push updated manifests back to repo
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add k8s/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(gitops): bump image tag to ${{ github.sha }}"
            git pull --rebase origin main
            git push origin main
          fi