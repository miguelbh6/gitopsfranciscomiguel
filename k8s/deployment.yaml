apiVersion: apps/v1
kind: Deployment
metadata:
  name: goserver
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels:
      app: goserver
  template:
    metadata:
      labels:
        app: goserver
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
      - name: goserver
        image: miguelbh6/gitopsfranciscomiguel:56700108ec8d86e0b297a0b412322f7bcba7dfdb
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"
          limits:
            memory: "128Mi"
            cpu: "500m"
        ports:
        - containerPort: 8080
